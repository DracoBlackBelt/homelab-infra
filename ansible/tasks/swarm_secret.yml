# Ensures ONE Docker Swarm secret exists: name = secret.key, value =
# secret.value. Include with a loop over {key,value} dicts.
#
# Swarm secrets are immutable, so this only CREATES a missing one -- rotating a
# secret stays the deliberate `docker secret rm` + service-update dance (same as
# the UI-created cloudflare_api_token). Delegated to a manager; the value goes
# through a mode-0600 temp file inside no_log blocks, never argv.
- name: "Check whether a swarm secret exists: {{ secret.key }}"
  ansible.builtin.command: docker secret inspect {{ secret.key }}
  delegate_to: "{{ swarm_init_manager }}"
  changed_when: false
  failed_when: false
  register: swarm_secret_present
  no_log: true

- name: "Write the secret to a root-only temp file: {{ secret.key }}"
  ansible.builtin.copy:
    content: "{{ secret.value }}"
    dest: /root/.swarm-secret
    mode: "0600"
  delegate_to: "{{ swarm_init_manager }}"
  when: swarm_secret_present.rc != 0
  no_log: true

- name: "Create the swarm secret: {{ secret.key }}"
  ansible.builtin.command: docker secret create {{ secret.key }} /root/.swarm-secret
  delegate_to: "{{ swarm_init_manager }}"
  when: swarm_secret_present.rc != 0
  no_log: true

# Unconditional: also clears the temp file left behind by an interrupted run.
- name: "Remove the temp file"
  ansible.builtin.file:
    path: /root/.swarm-secret
    state: absent
  delegate_to: "{{ swarm_init_manager }}"
  changed_when: false
  no_log: true
