# Full provisioning chain for every VM, in dependency order:
#   1. tailscale.yml -- join the tailnet (the Komodo Core address is
#      tailnet-only, so everything below needs this first)
#   2. docker.yml    -- Docker Engine, which both Swarm and Periphery act on
#   3. swarm.yml     -- converge the Docker Swarm (all nodes managers)
#   4. komodo.yml    -- periphery agent, which dials Core and self-onboards
#
# Each playbook can also be run standalone. Usage:
#   cd ansible && ansible-playbook site.yml
#   cd ansible && ansible-playbook site.yml --limit komodo-srv-01
- name: Join the tailnet
  import_playbook: tailscale.yml
- name: Install Docker Engine
  import_playbook: docker.yml
- name: Form the Docker Swarm
  import_playbook: swarm.yml
- name: Install Komodo Periphery
  import_playbook: komodo.yml
