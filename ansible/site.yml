# Full provisioning chain: hardening -> tailscale -> docker -> swarm -> komodo.
# Order matters -- the Komodo Core address is tailnet-only, so tailscale must
# come first. Each play also runs standalone.
#
#   cd ansible && ansible-playbook site.yml [--limit <vm>]
- name: Harden the hosts
  import_playbook: hardening.yml
- name: Join the tailnet
  import_playbook: tailscale.yml
- name: Install Docker Engine
  import_playbook: docker.yml
- name: Form the Docker Swarm
  import_playbook: swarm.yml
- name: Install Komodo Periphery
  import_playbook: komodo.yml
