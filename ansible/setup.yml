- name: Base setup
  hosts: vms
  vars:
    # The user cloud-init created, which is also who this play connected as --
    # tofu exports it as ansible_user, so the name is defined in exactly one
    # place. There is no separate admin account: debian *is* the admin.
    admin_user: "{{ ansible_user }}"
    swap_size_mb: 1024
    # ssh, dockge. Add a stack's port here when you expose one -- one place to
    # change, same pattern as tofu/vms.tf's vms map.
    firewall_allowed_tcp_ports: [22, 5001]

  tasks:
    # SSH answers before cloud-init has finished, and cloud-init's own apt run
    # holds the dpkg lock while it does. Without this the first task below is a
    # coin flip on a freshly created VM.
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc not in [0, 2] # 2 is "done, with recoverable errors"
      tags: [base]

    - name: Update and upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 300
      tags: [base]

    - name: Remove unneeded packages
      ansible.builtin.apt:
        autoremove: true
      tags: [base]

    # A kernel or library upgrade above can leave this file behind. Rebooting
    # here means a fresh VM (or a re-run after patches) never runs the rest of
    # the play on stale libraries -- unattended-upgrades' own reboot handles
    # this between playbook runs; this task covers the run itself.
    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      changed_when: false
      tags: [base]

    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "Rebooting after package update"
        reboot_timeout: 300
      when: reboot_required.stat.exists
      tags: [base]

    - name: Base packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - git
          - vim
          - htop
          - unattended-upgrades
          - sudo
          # deb822_repository is a python-debian wrapper and fails outright
          # without this; the cloud image does not ship it.
          - python3-debian
          # community.docker modules (docker_compose_v2 below) drive the Docker
          # API through the Python SDK. The distro package exists, which avoids
          # pip and Debian 13's externally-managed-environment restriction.
          - python3-docker
        state: present
      tags: [base]

    - name: Timezone
      community.general.timezone:
        name: Europe/Amsterdam
      tags: [base]

    # 1G on top of the default 1024M VM memory: enough headroom for Docker
    # plus a couple of compose stacks without a stray container OOM-killing
    # something else on the host. fallocate/mkswap/swapon are gated on the
    # stat check so re-runs don't re-create a swapfile that's already active.
    - name: Check for existing swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile_stat
      tags: [base]

    - name: Create, format and enable swapfile
      when: not swapfile_stat.stat.exists
      tags: [base]
      block:
        - name: Allocate swapfile
          ansible.builtin.command: fallocate -l {{ swap_size_mb }}M /swapfile
        - name: Restrict swapfile permissions
          ansible.builtin.file:
            path: /swapfile
            mode: "0600"
        - name: Format swapfile
          ansible.builtin.command: mkswap /swapfile
        - name: Enable swapfile
          ansible.builtin.command: swapon /swapfile

    - name: Persist swapfile in fstab
      ansible.posix.mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present
      tags: [base]

    - name: Lower swappiness for a mostly-Docker host
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        state: present
      tags: [base]

    # The SSH key itself was installed by cloud-init from the same file this
    # task reads, so on healthy VMs it is a no-op -- it only self-heals a
    # template whose key went stale. It must stay: it is the first thing
    # Ansible does that can repair the login path it itself depends on. (The
    # user/group membership lives after the Docker install, because the docker
    # group does not exist until the docker-ce package creates it.)

    - name: Authorized key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
      tags: [security]

    - name: Passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/{{ admin_user }}
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s
      tags: [security]

    - name: Enable unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"
      tags: [patching]

    # Debian's own unattended-upgrades config already limits itself to the
    # security suite by default; what it does not default to is rebooting
    # after a kernel update. A separate drop-in rather than an edit to the
    # package's own 50unattended-upgrades.conf, so a package upgrade of
    # unattended-upgrades itself never conflicts with this file.
    - name: Auto-reboot after unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51-unattended-upgrades-reboot.conf
        content: |
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
          Unattended-Upgrade::Automatic-Reboot-Time "03:30";
        mode: "0644"
      tags: [patching]

    - name: Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present
        enabled: true
      tags: [docker]

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      tags: [docker]

    # Placed before the service is started, so the first start already has
    # this config and no restart is needed. log-opts is the load-bearing part:
    # unbounded json-file logs are what actually fills a disk on a long-running
    # host. default-address-pools is a small hygiene addition -- this LAN is
    # 10.0.0.0/24 so it doesn't overlap Docker's own default range, but it
    # keeps the range explicit rather than implicit.
    - name: Configure the Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" },
            "default-address-pools": [{ "base": "172.30.0.0/16", "size": 24 }]
          }
        mode: "0644"
      notify: restart docker
      tags: [docker]

    - name: Docker running and enabled
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
      tags: [docker]

    - name: Promote the cloud-init user to admin
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups:
          - sudo
          - docker
        append: true
        shell: /bin/bash
        # cloud-init gives the user /bin/sh; a login-capable shell makes it a
        # usable admin account, and the docker group keeps `docker` usable
        # without sudo. Placed after the Docker install on purpose: the
        # docker group does not exist until the docker-ce package creates it,
        # and this task fails otherwise.
      tags: [docker, security]

    # --- Dockge: web UI for managing compose stacks (https://dockge.kuma.pet) ---

    - name: Create directories for Dockge and its stacks
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/dockge
        - /opt/stacks
      tags: [dockge]

    - name: Download the Dockge compose file
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/louislam/dockge/master/compose.yaml
        dest: /opt/dockge/compose.yaml
        mode: "0644"
      # Re-downloaded every run, but get_url only reports changed when the
      # bytes differ -- idempotent, while still tracking the upstream file.
      tags: [dockge]

    - name: Start Dockge
      community.docker.docker_compose_v2:
        project_name: dockge
        project_src: /opt/dockge
        state: present
        remove_orphans: true
      # project_src is a *directory*: the module runs compose from it, which is
      # exactly what `cd /opt/dockge && docker compose up -d` does, and keeps
      # the compose file's relative ./data volume resolving inside /opt/dockge.
      # (The alternative, `definition`, materialises the file in a temp dir,
      # which would break that relative path.) The module diffs the live stack,
      # so re-runs are no-ops until the file or the containers change. Dockge
      # listens on port 5001.
      tags: [dockge]

    # --- Watchtower: auto-updates containers Dockge manages ---
    # Deployed as a stack under /opt/stacks, the same way any Dockge-managed
    # service is, so it shows up in the Dockge UI too. WATCHTOWER_LABEL_ENABLE
    # makes updates opt-in per stack rather than a blanket auto-update of
    # everything: a service only gets updated once its compose file carries
    # `labels: ["com.centurylinklabs.watchtower.enable=true"]`.

    - name: Create the Watchtower stack directory
      ansible.builtin.file:
        path: /opt/stacks/watchtower
        state: directory
        mode: "0755"
      tags: [watchtower]

    - name: Watchtower compose file
      ansible.builtin.copy:
        dest: /opt/stacks/watchtower/compose.yaml
        content: |
          services:
            watchtower:
              image: containrrr/watchtower
              restart: unless-stopped
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
              environment:
                WATCHTOWER_CLEANUP: "true"
                WATCHTOWER_LABEL_ENABLE: "true"
                WATCHTOWER_SCHEDULE: "0 30 3 * * *"
        mode: "0644"
      tags: [watchtower]

    - name: Start Watchtower
      community.docker.docker_compose_v2:
        project_name: watchtower
        project_src: /opt/stacks/watchtower
        state: present
        remove_orphans: true
      tags: [watchtower]

    # Rules are added before the default-deny policy is set, and the policy is
    # set before ufw is enabled -- so the play can never lock itself out of its
    # own SSH session mid-run.
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
      tags: [security]

    - name: Allow required inbound ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ firewall_allowed_tcp_ports }}"
      tags: [security]

    - name: Set ufw default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }
      tags: [security]

    - name: Enable ufw
      community.general.ufw:
        state: enabled
      tags: [security]

    # A drop-in rather than an edit to sshd_config: the stock Debian config
    # includes sshd_config.d/*.conf on its first line, and sshd keeps the first
    # value it sees for a keyword. Anything cloud-init leaves in 50-cloud-init
    # .conf would therefore beat an edit to the main file. 00- sorts ahead of it.
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PermitRootLogin prohibit-password
          PasswordAuthentication no
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: restart sshd
      tags: [security]

  handlers:
    - name: restart docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
