- name: Base setup
  hosts: vms
  vars:
    # The user cloud-init created, which is also who this play connected as --
    # tofu exports it as ansible_user, so the name is defined in exactly one
    # place. There is no separate admin account: debian *is* the admin.
    admin_user: "{{ ansible_user }}"

  tasks:
    # SSH answers before cloud-init has finished, and cloud-init's own apt run
    # holds the dpkg lock while it does. Without this the first task below is a
    # coin flip on a freshly created VM.
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc not in [0, 2] # 2 is "done, with recoverable errors"

    - name: Update and upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 300

    - name: Remove unneeded packages
      ansible.builtin.apt:
        autoremove: true

    - name: Base packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - git
          - vim
          - htop
          - unattended-upgrades
          - sudo
          # deb822_repository is a python-debian wrapper and fails outright
          # without this; the cloud image does not ship it.
          - python3-debian
          # community.docker modules (docker_compose_v2 below) drive the Docker
          # API through the Python SDK. The distro package exists, which avoids
          # pip and Debian 13's externally-managed-environment restriction.
          - python3-docker
        state: present

    - name: Timezone
      community.general.timezone:
        name: Europe/Amsterdam

    # The SSH key itself was installed by cloud-init from the same file this
    # task reads, so on healthy VMs it is a no-op -- it only self-heals a
    # template whose key went stale. It must stay: it is the first thing
    # Ansible does that can repair the login path it itself depends on. (The
    # user/group membership lives after the Docker install, because the docker
    # group does not exist until the docker-ce package creates it.)

    - name: Authorized key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/{{ admin_user }}
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Enable unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"
    
    - name: Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present
        enabled: true
    
    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Docker running and enabled
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Promote the cloud-init user to admin
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups:
          - sudo
          - docker
        append: true
        shell: /bin/bash
        # cloud-init gives the user /bin/sh; a login-capable shell makes it a
        # usable admin account, and the docker group keeps `docker` usable
        # without sudo. Placed after the Docker install on purpose: the
        # docker group does not exist until the docker-ce package creates it,
        # and this task fails otherwise.

    # --- Dockge: web UI for managing compose stacks (https://dockge.kuma.pet) ---

    - name: Create directories for Dockge and its stacks
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/dockge
        - /opt/stacks

    - name: Download the Dockge compose file
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/louislam/dockge/master/compose.yaml
        dest: /opt/dockge/compose.yaml
        mode: "0644"
      # Re-downloaded every run, but get_url only reports changed when the
      # bytes differ -- idempotent, while still tracking the upstream file.

    - name: Start Dockge
      community.docker.docker_compose_v2:
        project_name: dockge
        project_src: /opt/dockge
        state: present
        remove_orphans: true
      # project_src is a *directory*: the module runs compose from it, which is
      # exactly what `cd /opt/dockge && docker compose up -d` does, and keeps
      # the compose file's relative ./data volume resolving inside /opt/dockge.
      # (The alternative, `definition`, materialises the file in a temp dir,
      # which would break that relative path.) The module diffs the live stack,
      # so re-runs are no-ops until the file or the containers change. Dockge
      # listens on port 5001.

    # A drop-in rather than an edit to sshd_config: the stock Debian config
    # includes sshd_config.d/*.conf on its first line, and sshd keeps the first
    # value it sees for a keyword. Anything cloud-init leaves in 50-cloud-init
    # .conf would therefore beat an edit to the main file. 00- sorts ahead of it.
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PermitRootLogin prohibit-password
          PasswordAuthentication no
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: restart sshd

  handlers:
    - name: restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
