- name: Base setup
  hosts: vms
  vars:
    admin_user: job

  tasks:
    # SSH answers before cloud-init has finished, and cloud-init's own apt run
    # holds the dpkg lock while it does. Without this the first task below is a
    # coin flip on a freshly created VM.
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: cloud_init_status.rc not in [0, 2] # 2 is "done, with recoverable errors"

    - name: Update and upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 300

    - name: Remove unneeded packages
      ansible.builtin.apt:
        autoremove: true

    - name: Base packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - git
          - vim
          - htop
          - unattended-upgrades
          - sudo
          # deb822_repository is a python-debian wrapper and fails outright
          # without this; the cloud image does not ship it.
          - python3-debian
        state: present

    - name: Timezone
      community.general.timezone:
        name: Europe/Amsterdam

    - name: Admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: sudo
        append: true
        shell: /bin/bash

    - name: Authorized key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/{{ admin_user }}
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Enable unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"
    
    - name: Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present
        enabled: true
    
    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add admin user to docker group
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: docker
        append: true

    - name: Docker running and enabled
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    # A drop-in rather than an edit to sshd_config: the stock Debian config
    # includes sshd_config.d/*.conf on its first line, and sshd keeps the first
    # value it sees for a keyword. Anything cloud-init leaves in 50-cloud-init
    # .conf would therefore beat an edit to the main file. 00- sorts ahead of it.
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PermitRootLogin prohibit-password
          PasswordAuthentication no
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: restart sshd

  handlers:
    - name: restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
