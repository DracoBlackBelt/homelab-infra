[defaults]
inventory = inventory/
# Deliberate: VMs are rebuilt from the golden template often, so pinning host
# keys would mean curating known_hosts on every rebuild. Acceptable on the LAN.
host_key_checking = False
# No stray *.retry files in ansible/ -- every play here is safe to rerun.
retry_files_enabled = False
# Same auto-discovery as the default `auto`, minus the per-host notice. The
# guests are Debian 13 (/usr/bin/python3.13); a path is deliberately not pinned
# so a future interpreter is still found.
interpreter_python = auto_silent
# Secrets live in vault-encrypted group_vars (e.g. vms/vault.yml). The password
# file sits at the repo root and is gitignored -- create it once per machine.
vault_password_file = ../.vault-pass

[ssh_connection]
# Fewer round-trips per task, and a persistent master across tasks and hosts.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
