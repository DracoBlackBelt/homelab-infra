[defaults]
inventory = inventory/
# Trust-on-first-use, then pin: the first connection to a rebuilt VM adds its
# host key, and a later key *change* is refused (the MITM tell). This is
# deliberately stronger than the old host_key_checking=False. VMs are rebuilt
# from the golden template often, so a curated known_hosts is not practical;
# re-provisioning writes fresh keys into ~/.ssh/known_hosts via accept-new.
host_key_checking = True
# No stray *.retry files in ansible/ -- every play here is safe to rerun.
retry_files_enabled = False
# Same auto-discovery as the default `auto`, minus the per-host notice. The
# guests are Debian 13 (/usr/bin/python3.13); a path is deliberately not pinned
# so a future interpreter is still found.
interpreter_python = auto_silent
# Secrets live in SOPS-encrypted group_vars (e.g. group_vars/vms/secrets.sops.yml).
# The age private key stays outside the repo (~/.config/sops/age/keys.txt); the
# community.sops vars plugin decrypts those files as they load. See AGENTS.md.
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
# Fewer round-trips per task, and a persistent master across tasks and hosts.
pipelining = True
# accept-new pairs with host_key_checking=True: unknown hosts are trusted once,
# known hosts must present the same key.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
