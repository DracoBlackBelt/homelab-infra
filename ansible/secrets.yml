# Seed the cluster's Docker Swarm secrets from the SOPS-encrypted values in
# group_vars/vms/secrets.sops.yml. Run this BEFORE deploying a stack that
# references a secret as `external: true` -- a missing secret fails the deploy.
#
# Idempotent and immutability-aware: it only creates what is missing (see
# tasks/swarm_secret.yml), so reruns are no-ops. Rotating a secret is a manual
# `docker secret rm` + service update, deliberately not automated here.
#
# Usage: cd ansible && ansible-playbook secrets.yml
- name: Seed swarm secrets from SOPS
  hosts: vms
  gather_facts: false

  vars:
    # secret name => value (values are the SOPS-decrypted group_vars)
    swarm_secrets:
      searxng_secret: "{{ searxng_secret }}"
      flame_password: "{{ flame_password }}"

  tasks:
    - name: Remove any stale secret temp file
      ansible.builtin.file:
        path: /root/.swarm-secret
        state: absent
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      changed_when: false
      no_log: true

    - name: Ensure each swarm secret exists
      ansible.builtin.include_tasks: tasks/swarm_secret.yml
      loop: "{{ swarm_secrets | dict2items }}"
      loop_control:
        loop_var: secret
        label: "{{ secret.key }}"
      run_once: true
