# The Proxmox host itself, for plays that configure it rather than clone from it
# (currently template.yml). The VMs are deliberately NOT here: OpenTofu creates
# them, so they come from inventory/tofu.py. This adds the one host tofu does not
# manage -- the same host tofu/provider.tf talks to over the API.
#
# Reached over the tailnet, not the LAN: root@10.0.0.2 rejects key auth, while
# the host's Tailscale SSH authorizes root (same MagicDNS tailnet as
# komodo_core_address). ansible.cfg disables host key checking.
all:
  children:
    pve:
      hosts:
        prox:
          ansible_host: prox.tail9ef5e7.ts.net
          ansible_user: root
