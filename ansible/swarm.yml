# Converge a Docker Swarm across the VMs.
#
# Komodo's Swarm resource only *points at* manager Servers -- it never runs
# `swarm init` or the joins -- so membership is provisioned here (and merely
# observed by komodo/swarms.toml). `swarm_manager_hosts` (group_vars/vms/all.yml)
# are the 3 raft managers (quorum survives one loss) and hold the Traefik edge;
# every other member joins as a WORKER running app tasks, so an app OOM can't
# disturb raft. `swarm_edge_host` is the single manager that also carries the
# `edge` label the public VPS handoff constrains on. `swarm_init_manager` is the
# bootstrap leader and join point;
# every node advertises on its LAN address (vmbr0) -- ports 2377/7946/4789 stay
# on-LAN.
#
# Lost bootstrap manager: `docker node rm -f <host>` from another manager,
# repoint `swarm_init_manager` at a survivor, re-run. Survivors keep state.
#
# Two Debian+swarm ingress traps, both handled below (see README "Swarm"):
# openvswitch is never loaded, and swarm's stock 10.0.0.0/24 ingress collides
# with this LAN. Fresh clusters dodge the latter via --default-addr-pool; the
# live cluster was migrated to 10.10.0.0/24 by hand on 2026-09-15.
#
# Idempotent: active nodes are never re-inited, re-joined or left. A `pending`
# node aborts the play rather than being forced.
#
# Usage: cd ansible && ansible-playbook swarm.yml
- name: Form the Docker Swarm
  hosts: vms
  gather_facts: false

  handlers:
    - name: Restart docker for ingress datapath
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
      # One node at a time: restarting dockerd restarts that node's containers
      # and briefly un-Ready's it -- don't blip several at once.
      throttle: 1

  tasks:
    - name: Check loaded kernel modules
      ansible.builtin.command: lsmod
      register: lsmod
      changed_when: false

    # Docker Swarm ingress (published ports -> service VIP) is an OVS
    # datapath; Debian ships the openvswitch module but never loads it.
    # Without it, stacks deploy and localhost works, but LAN ingress to
    # the VIP silently times out. Restarting dockerd re-programs the
    # datapath for existing services.
    - name: Load openvswitch (swarm ingress datapath)
      ansible.builtin.command: modprobe openvswitch
      when: "'openvswitch' not in lsmod.stdout"
      notify: Restart docker for ingress datapath

    - name: Load openvswitch at boot too
      ansible.builtin.copy:
        dest: /etc/modules-load.d/openvswitch.conf
        content: "openvswitch\n"
        owner: root
        group: root
        mode: "0644"

    - name: Read current swarm state
      ansible.builtin.command: >-
        docker info --format
        '{% raw %}{{ .Swarm.LocalNodeState }}{% endraw %}'
      register: swarm_state
      changed_when: false

    - name: Fail if any node is stuck in pending
      ansible.builtin.assert:
        that: swarm_state.stdout != 'pending'
        fail_msg: >-
          {{ inventory_hostname }} is 'pending' (told to join but hasn't
          checked in) -- fix the network or `docker swarm leave --force` by
          hand, then re-run. Refusing to touch it.

    - name: Initialize the swarm on the bootstrap manager
      ansible.builtin.command: >-
        docker swarm init --advertise-addr {{ ansible_host }}
        --default-addr-pool 10.10.0.0/16 --default-addr-pool-mask-length 24
      when:
        - inventory_hostname == swarm_init_manager
        - swarm_state.stdout == 'inactive'

    # Only needed if some node is still inactive (fresh cluster, or a new VM).
    # Gating it keeps a healthy cluster from hard-depending on the bootstrap
    # manager just to fetch a token nobody will use.
    - name: Check whether any node still needs to join
      ansible.builtin.set_fact:
        swarm_needs_token: >-
          {{ ansible_play_hosts_all
             | map('extract', hostvars, 'swarm_state')
             | map(attribute='stdout')
             | select('eq', 'inactive') | list | length > 0 }}
      run_once: true

    - name: Fetch the manager join token
      ansible.builtin.command: docker swarm join-token -q manager
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      when: swarm_needs_token
      register: manager_join_token
      changed_when: false
      no_log: true

    - name: Fetch the worker join token
      ansible.builtin.command: docker swarm join-token -q worker
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      when: swarm_needs_token
      register: worker_join_token
      changed_when: false
      no_log: true

    - name: Join the swarm
      # --advertise-addr pins the LAN address explicitly. Without it Docker
      # infers the advertise IP from the outgoing route, which is the LAN today
      # but could pick the tailnet interface once we're on it -- and ports
      # 2377/7946/4789 must stay on-LAN. managers in swarm_manager_hosts use the
      # manager token; everyone else joins as a worker.
      ansible.builtin.command: >-
        docker swarm join
        --token {{ (inventory_hostname in swarm_manager_hosts) | ternary(manager_join_token.stdout, worker_join_token.stdout) | trim }}
        --advertise-addr {{ ansible_host }}
        {{ hostvars[swarm_init_manager].ansible_host }}:2377
      when:
        - inventory_hostname != swarm_init_manager
        - swarm_state.stdout == 'inactive'
      no_log: true

    # Tripwire: swarm's stock ingress subnet is 10.0.0.0/24, which collides
    # with this LAN (10.0.0.0/24) and silently blackholes routing-mesh
    # replies. A fresh `swarm init` above avoids it via --default-addr-pool;
    # the live cluster was migrated by hand (see header).
    - name: Read the ingress overlay subnet
      ansible.builtin.command: >-
        docker network inspect ingress
        --format '{% raw %}{{ (index .IPAM.Config 0).Subnet }}{% endraw %}'
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      register: ingress_net
      changed_when: false

    # Real CIDR containment (ansible.utils.in_network, pinned in
    # requirements.yml) rather than a string-prefix compare: fails if the
    # ingress subnet swallows any of our LAN addresses.
    - name: Assert the ingress subnet does not swallow the LAN addresses
      ansible.builtin.assert:
        that: >-
          ansible_play_hosts_all | map('extract', hostvars, 'ansible_host')
          | select('ansible.utils.in_network', ingress_net.stdout)
          | list | length == 0
        fail_msg: >-
          Ingress overlay runs on {{ ingress_net.stdout }}, which contains one
          of the LAN addresses. Recreate it: remove stacks, `yes | docker
          network rm ingress`, then `docker network create --ingress --driver
          overlay --subnet 10.10.0.0/24 --gateway 10.10.0.1 ingress`.
      run_once: true

    # A dockerd restart (e.g. a daemon.json change) can briefly leave nodes not
    # yet re-registered as Ready. Wait for the cluster to settle before judging
    # it, so a restart doesn't fail the asserts below.
    - name: List swarm nodes
      ansible.builtin.command: >-
        docker node ls --format
        '{% raw %}{{json .}}{% endraw %}'
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      register: nodes
      until: >-
        (nodes.stdout_lines | select('ne', '') | map('from_json')
         | selectattr('Status', 'equalto', 'Ready') | list | length)
        == (nodes.stdout_lines | select('ne', '') | list | length)
      retries: 18
      delay: 5
      changed_when: false

    - name: Collect Ready nodes and Ready managers
      ansible.builtin.set_fact:
        swarm_ready_nodes: >-
          {{ nodes.stdout_lines | map('from_json') | list
             | selectattr('Status', 'equalto', 'Ready')
             | map(attribute='Hostname') | list }}
        swarm_managers: >-
          {{ nodes.stdout_lines | map('from_json') | list
             | selectattr('Status', 'equalto', 'Ready')
             | selectattr('Availability', 'equalto', 'Active')
             | selectattr('ManagerStatus', 'defined')
             | rejectattr('ManagerStatus', 'in', ['', 'Unavailable'])
             | map(attribute='Hostname') | list }}
      run_once: true

    # Scope-aware: hard-fail only for nodes this run actually touched. Comparing
    # against groups['vms'] would break any --limit run while a newly declared
    # VM is still unprovisioned (e.g. `site.yml --limit <existing>` with a 4th
    # VM in tfvars). Role-aware: managers must be Ready managers, workers only
    # need to be Ready nodes.
    - name: Assert the managers in this run are Ready managers
      ansible.builtin.assert:
        that: (ansible_play_hosts_all | intersect(swarm_manager_hosts) | difference(swarm_managers)) | length == 0
        fail_msg: >-
          {{ ansible_play_hosts_all | intersect(swarm_manager_hosts) | difference(swarm_managers) | join(', ') }}
          did not come up as Ready managers -- run `docker node ls` on
          {{ swarm_init_manager }} to see who isn't.
      run_once: true

    - name: Assert the workers in this run are Ready nodes
      ansible.builtin.assert:
        that: (ansible_play_hosts_all | difference(swarm_manager_hosts) | difference(swarm_ready_nodes)) | length == 0
        fail_msg: >-
          {{ ansible_play_hosts_all | difference(swarm_manager_hosts) | difference(swarm_ready_nodes) | join(', ') }}
          did not come up as Ready nodes -- run `docker node ls` on
          {{ swarm_init_manager }} to see who isn't.
      run_once: true

    - name: Note inventory VMs that are not Ready nodes yet
      ansible.builtin.debug:
        msg: >-
          Not yet Ready: {{ groups['vms'] | difference(swarm_ready_nodes) | join(', ') }}
      when: groups['vms'] | difference(swarm_ready_nodes) | length > 0
      run_once: true

    # Placement pools (swarm_node_labels in group_vars/vms/all.yml). Composes
    # pin stateful services with `node.labels.pool == "NN"` instead of a
    # hostname, so a replacement VM is re-labelled here and no stack file
    # changes. Read-then-write so the task reports changed only when it
    # actually relabels something.
    - name: Read each node's current labels
      ansible.builtin.command: >-
        docker node inspect {{ item.key }} --format
        '{% raw %}{{ json .Spec.Labels }}{% endraw %}'
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      register: node_labels
      changed_when: false
      loop: "{{ swarm_node_labels | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Label each node with its placement pool
      ansible.builtin.command: >-
        docker node update --label-add pool={{ item.item.value }} {{ item.item.key }}
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      loop: "{{ node_labels.results }}"
      loop_control:
        label: "{{ item.item.key }} pool={{ item.item.value }}"
      when: ((item.stdout | from_json) or {}).get('pool') != item.item.value

    # Public-edge label (swarm_edge_host above): the manager that publishes the
    # host-mode handoff port the VPS reverse-proxies to. Must exist BEFORE the
    # Traefik stack constraining on it is deployed, or the service is
    # unschedulable. Same read-then-write shape as the pool labels.
    - name: Read the public-edge node's labels
      ansible.builtin.command: >-
        docker node inspect {{ swarm_edge_host }} --format
        '{% raw %}{{ json .Spec.Labels }}{% endraw %}'
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      register: edge_node_labels
      changed_when: false

    - name: Label the public-edge node
      ansible.builtin.command: >-
        docker node update --label-add edge=true {{ swarm_edge_host }}
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      when: ((edge_node_labels.stdout | from_json) or {}).get('edge') != 'true'

    # Cluster-wide overlay shared by the Traefik edge and every routed app.
    # Stack-created networks get a '<stack>_' prefix and thus can't be shared
    # across stacks, so the stacks declare it `external: true` and this play
    # owns creation (attachable: lets you `docker run` a debug container onto
    # it too). Idempotent: inspect, create only if missing.
    - name: Check for the shared 'proxy' overlay network
      ansible.builtin.command: docker network inspect proxy
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      register: proxy_net
      changed_when: false
      failed_when: false

    - name: Create the shared 'proxy' overlay network
      ansible.builtin.command: docker network create --driver overlay --attachable proxy
      delegate_to: "{{ swarm_init_manager }}"
      run_once: true
      when: proxy_net.rc != 0

    - name: Swarm status
      ansible.builtin.debug:
        msg: >-
          Swarm on {{ swarm_init_manager }} ({{ hostvars[swarm_init_manager].ansible_host }}:2377):
          {{ swarm_managers | length }} Ready managers ({{ swarm_managers | join(', ') }}),
          {{ (swarm_ready_nodes | length) - (swarm_managers | length) }} Ready workers.
          Overlay 'proxy' ensured for Traefik routing.
          Next: create the ResourceSync over komodo/ so the Swarm resource appears in Core.
