# Install Tailscale from the official apt repo and join every VM to the tailnet.
#
# Auth key: group_vars/vms/secrets.sops.yml (SOPS/age; the age key stays outside
# the repo -- see ansible.cfg). Generate a REUSABLE + EPHEMERAL key at
# https://login.tailscale.com/admin/settings/keys: reusable = one key covers
# every current and future VM; ephemeral = long-offline nodes are GC'd and
# re-register with the same key. Auth keys expire after at most 90 days
# (already-registered nodes are unaffected until their own 180-day node-key
# expiry) -- swap in a fresh one with `sops ansible/group_vars/vms/secrets.sops.yml`.
#
# The key reaches `tailscale up` via a mode-0600 temp file (--auth-key=file://):
# the bare CLI ignores TS_AUTHKEY (containerboot/tsnet only), and an in-argv flag
# can be echoed back in tailscale's own error output.
#
# Usage: cd ansible && ansible-playbook tailscale.yml [--tags install] [--limit <vm>]
- name: Install and register Tailscale
  hosts: vms
  gather_facts: true

  vars:
    tailscale_repo_url: "https://pkgs.tailscale.com/stable/debian"
    tailscale_codename: "{{ ansible_facts['distribution_release'] }}"

  tasks:
    - name: Add the Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: [deb]
        uris: "{{ tailscale_repo_url }}/"
        suites: "{{ tailscale_codename }}"
        components: [main]
        # The module fetches the key itself and installs it under
        # /etc/apt/keyrings/<name>.gpg.
        signed_by: "{{ tailscale_repo_url }}/{{ tailscale_codename }}.noarmor.gpg"
        state: present
      tags: install

    - name: Install the tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        # Unconditional: deb822_repository does not refresh the cache itself,
        # and a cache_valid_time window would let a stale cache hide the
        # package just added by the previous task.
        update_cache: true
      tags: install

    - name: Ensure tailscaled is enabled and running
      ansible.builtin.systemd_service:
        name: tailscaled
        state: started
        enabled: true
      tags: install

    - name: Verify a real auth key has been configured
      ansible.builtin.assert:
        that: tailscale_auth_key is search('tskey-auth-') and 'REPLACE-ME' not in tailscale_auth_key
        quiet: true
        fail_msg: "Replace the placeholder first: sops ansible/group_vars/vms/secrets.sops.yml"
      tags: register

    - name: Check current Tailscale login state
      ansible.builtin.command: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: tailscale_status.rc not in (0, 1)  # rc 1 = logged out
      tags: register

    # Clean up after an interrupted run: the key is removed in the block's
    # `always`, but a SIGKILL between write and cleanup would leave it behind.
    - name: Remove any stale auth-key temp file
      ansible.builtin.file:
        path: /root/.tailscale-authkey
        state: absent
      changed_when: false
      tags: register

    - name: Register the node with the tailnet
      # search() on the raw JSON instead of from_json: on rc 1 (logged out) the
      # stdout can be empty, and an exception there would abort the play rather
      # than just re-registering the node.
      when: >-
        tailscale_status.rc != 0
        or tailscale_status.stdout is not search('"BackendState"\s*:\s*"(Running|Starting)"')
      tags: register
      block:
        - name: Write the auth key to a root-only temp file
          ansible.builtin.copy:
            content: "{{ tailscale_auth_key }}"
            dest: /root/.tailscale-authkey
            mode: "0600"
          no_log: true

        - name: Bring up tailscale
          ansible.builtin.command:
            cmd: >-
              tailscale up
              --hostname {{ inventory_hostname }}
              --ssh
              --auth-key=file:///root/.tailscale-authkey
          no_log: true
      always:
        - name: Remove the auth key temp file
          ansible.builtin.file:
            path: /root/.tailscale-authkey
            state: absent

    - name: Ensure Tailscale SSH stays enabled across re-registrations
      ansible.builtin.command: tailscale set --ssh
      changed_when: false
      tags: register

    - name: Wait for a tailnet IPv4 address
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      until: tailscale_ip.rc == 0 and tailscale_ip.stdout | trim | length > 0
      retries: 12
      delay: 5
      changed_when: false
      tags: register

    - name: Show tailnet identity
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is on the tailnet at {{ tailscale_ip.stdout | trim }}"
      tags: register
