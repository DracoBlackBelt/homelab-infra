# SOPS creation rules: which age keys can decrypt which files.
#
# Private keys stay outside the repo, so only public recipients are committed:
#   * workstation -> ~/.config/sops/age/keys.txt (or $SOPS_AGE_KEY_FILE)
#   * escrow      -> ~/.config/sops/age/recovery-keys.txt, kept OFFLINE
#
# Two recipients so losing one decryptor does not lose every secret; either key
# alone decrypts. After changing this list, re-wrap existing files:
#   sops updatekeys ansible/group_vars/vms/secrets.sops.yml
creation_rules:
  - path_regex: '\.sops\.ya?ml$'
    age:
      - age12f27dnat4w09xcad3wrwxj0e84zgd5vupwc996gw4u42tdjaas6qj5yu7m # workstation
      - age1pfdamnetdjntyxdcrmlmlg4xealmf7urhuxdt7g3mvrpxjy6kfpqumf6na # escrow
