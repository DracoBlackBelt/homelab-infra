# Komodo user group for the AI agent's read-only Komodo MCP server (see README
# "Agent access"). Permissions are not secret, so they live here; the API key
# that authenticates as this user does NOT -- it stays on the workstation at
# ~/.config/komodo/mcp-agent.env (mode 0600), created in the Komodo UI under
# Settings -> API Keys.
#
# Read, with NO `specific` permissions: the granular ones (Logs, Inspect,
# Terminal, Attach, Processes) reach into container env, logs and shells -- i.e.
# secrets -- so the agent gets none of them. Read alone gives full visibility of
# resource state while blocking every action server-side, so even a buggy or
# hostile MCP client cannot change anything.
#
# The `users` entry must match an existing Komodo service user; create the user
# (and its API key) before this file is synced.

[[user_group]]
name = "mcp-readonly"
everyone = false
users = ["mcp-agent"]

all.Stack = "Read"
all.Server = "Read"
all.Swarm = "Read"
all.Deployment = "Read"
all.Repo = "Read"
all.Build = "Read"
all.Builder = "Read"
all.Procedure = "Read"
all.Action = "Read"
all.Alerter = "Read"
all.ResourceSync = "Read"
