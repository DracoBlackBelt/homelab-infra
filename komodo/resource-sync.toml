# The ResourceSync that applies this directory, declared in the directory it
# applies. Bootstrapping is chicken-and-egg: a sync has to exist before it can
# manage itself, so the FIRST one is still created by hand in the Core UI --
# and it must use exactly this `name`, `repo`, `branch` and `resource_path`,
# otherwise this file creates a SECOND sync over the same files and both will
# try to own the same resources. Check the UI sync's settings and align them
# (rename it if needed) after this file first syncs.
#
# --- Fresh Core (disaster recovery) -----------------------------------------
#   1. Core UI -> Resource Syncs -> New: repo DracoBlackBelt/homelab-infra,
#      branch main, path komodo/, name "homelab-infra".
#   2. Run it and confirm the computed actions. It will then match this
#      declaration and stop showing a diff for it.
#
# --- Why no `delete = true` -------------------------------------------------
# ResourceSyncConfig has `delete` ("delete resources not declared in the
# resource files") and `match_tags`. `delete` is left OFF on purpose: it is
# scoped to the resource *types* the sync knows about, and Komodo auto-creates
# Server resources from each Periphery agent. Enabling it without first
# confirming how it scopes Servers/other types risks deleting the platform out
# from under the sync. Today deletions are confirmation-gated instead -- see
# the README's "Adding an app". Turn it on deliberately, with match_tags, once
# that behaviour has been verified against this Core.
[[resource_sync]]
name = "homelab-infra"
description = "Applies komodo/ from git: the swarm, the stacks, and this sync"
tags = ["infra"]

[resource_sync.config]
git_provider = "github.com"
git_https = true
# Public repo: no git_account, so Komodo clones anonymously.
repo = "DracoBlackBelt/homelab-infra"
branch = "main"
files_on_host = false
resource_path = ["komodo/"]
include_resources = true
include_variables = true
webhook_enabled = true
