# Stacks declared to Komodo. Most target the 'homelab' swarm (swarms.toml),
# with compose files in this repo under stacks/ -- the ResourceSync clones
# homelab-infra and runs `docker stack deploy`. The repo is public, so no
# `git_account` is needed. A stack with `server = "..."` instead of
# `swarm = "..."` is a plain Compose stack on that one server.
#
# deploy = true: running the ResourceSync also deploys the stack. Caveat: it
# re-deploys when this TOML changes, NOT when a referenced compose file changes
# (Komodo #1120 / #1381), so a compose-only edit needs an explicit Deploy in the
# UI. Removing a block is likewise confirmation-gated, not automatic.

[[stack]]
name = "whoami"
description = "Swarm canary: proves membership + GitOps deploy end to end"
tags = ["swarm"]
deploy = true

[stack.config]
swarm = "homelab"
git_provider = "github.com"
repo = "DracoBlackBelt/homelab-infra"
branch = "main"
file_paths = ["stacks/whoami/docker-compose.yaml"]

