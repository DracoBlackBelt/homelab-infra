# Stacks deployed to the 'homelab' swarm (swarms.toml). The compose files
# live in this same repo under stacks/ -- Komodo clones homelab-infra and runs
# `docker stack deploy`. The repo is public, so no `git_account` is needed:
# Komodo clones it anonymously and no GitHub token is registered in Core.
#
# deploy = true means: running the ResourceSync also deploys the stack.
#
# Caveat: the sync re-deploys when this TOML changes, NOT when a referenced
# compose file changes (Komodo #1120 / #1381). A compose-only edit therefore
# needs an explicit Deploy in the UI. Deleting a stack here is likewise a
# confirmation-gated action, not automatic.

[[stack]]
name = "whoami"
description = "Swarm canary: proves membership + GitOps deploy end to end"
tags = ["swarm"]
deploy = true

[stack.config]
swarm = "homelab"
      git_provider = "github.com"
      repo = "DracoBlackBelt/homelab-infra"
branch = "main"
file_paths = ["stacks/whoami/docker-compose.yaml"]

