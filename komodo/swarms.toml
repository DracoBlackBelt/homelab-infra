# Komodo resources as code, synced by ONE bootstrap ResourceSync created in the
# Core UI (name "homelab-infra", repo DracoBlackBelt/homelab-infra, branch main,
# path komodo/). That sync is the one object deliberately NOT declared here:
# Komodo refuses to update a ResourceSync while it is running ("ResourceSync
# busy"), so a self-declaration could never apply and it fails the rest of the
# run. Every other object is diffed/created/updated from git.
#
# Rule: nothing secret in these files -- synced TOML is plaintext in git.

# The swarm converged by ansible/swarm.yml. This resource does NOT manage
# membership -- it registers the manager Servers Komodo talks through (tried in
# order; all are managers, so losing one keeps deploys alive via quorum).
[[swarm]]
name = "homelab"
description = "Docker Swarm on the homelab-infra VMs (3 managers + 3 workers)"
tags = ["swarm"]

[swarm.config]
servers = ["komodo-srv-01", "komodo-srv-02", "komodo-srv-03"]
send_unhealthy_alerts = true
