# Edge router for the swarm. The v3 Swarm provider reads routing from labels on
# SERVICES (defined in each app's compose), so adding a route never redeploys
# Traefik. Steady state: client -> any node :80/:443 (ingress mesh) -> this one
# task -> `proxy` overlay -> app:port; :80 308s to :443 and TLS is one Let's
# Encrypt wildcard via Cloudflare DNS-01. See README "Routing".
#
# The VPS public edge reverse-proxies to this task over the tailnet on the
# host-mode 8443 published below -- not the mesh: the 1450-byte VXLAN over a
# 1280-byte tailnet silently drops replies. See README "Public access".
#
# The image is ENTRYPOINT /entrypoint.sh + CMD ["traefik"], and a compose
# `command:` REPLACES the CMD -- keep `traefik` first below, or /entrypoint.sh
# tries to exec "--entrypoints..." as a binary.
#
# stop-first is REQUIRED: start-first would run two tasks against one acme.json.
# Do NOT add failure_action: rollback (README "Rolling updates").
x-update-config: &update-config
  order: stop-first
  parallelism: 1
  delay: 5s
  monitor: 30s

services:
  traefik:
    image: traefik:v3.7.13
    # The swarm provider needs the cluster API; the manager constraint below
    # keeps the local socket authoritative. :ro -- Traefik only reads.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/data
    networks:
      - proxy
    secrets:
      - cloudflare_api_token
    environment:
      # lego reads any provider var suffixed _FILE from the mounted secret.
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
    ports:
      # ingress = routing mesh: every node answers on 80/443.
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
      # Host-mode handoff for the VPS public edge: bypasses the routing mesh so
      # this hop never rides the 1450-MTU VXLAN over the 1280-MTU tailnet. Only
      # the edge-labelled node binds it.
      - target: 443
        published: 8443
        protocol: tcp
        mode: host
    command:
      # `traefik` first: compose command replaces the image CMD (see header).
      - traefik
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Trust the VPS's X-Forwarded-For (it overwrites XFF with the real client),
      # so apps log the client IP, not the VPS. Internal ingress clients are not
      # this IP, so their headers stay ignored exactly as today.
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=100.126.232.11
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=proxy
      - --certificatesresolvers.le.acme.email=job.r.huisman@gmail.com
      - --certificatesresolvers.le.acme.storage=/data/acme.json
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      # No acme.domains in v3: each router declares tls.domains[0].main itself.
      - --accesslog=true
      - --log.level=INFO
      - --ping=true
    # `traefik healthcheck --ping` recreates the internal :8080 entrypoint and
    # HEADs it. Must be a real check: Swarm replaces a task that reports
    # unhealthy, so a broken command becomes a restart loop (the web-check lesson).
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      # One task, on a manager: only one process may drive the DNS-01 resolver
      # (no shared ACME storage in OSS Traefik). The mesh still accepts 80/443 on
      # every node. See README "Routing".
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.edge == true
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  proxy:
    name: proxy
    external: true

secrets:
  cloudflare_api_token:
    external: true

volumes:
  traefik-acme:
