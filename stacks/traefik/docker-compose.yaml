# Edge router for the swarm: v3-native Swarm provider reads routing labels
# off SERVICES (they live in each app's compose file under deploy.labels).
# Steady state: client -> node :80 (ingress mesh) -> traefik (global, one task
# per node) -> proxy overlay -> app:port; :80 308s to :443 and TLS is served
# with a single Let's Encrypt wildcard cert (Cloudflare DNS-01).
#
# Secret plumbing: the Cloudflare token is created OUT of git (Komodo UI ->
# swarm 'homelab' -> Secrets -> cloudflare_api_token) and referenced here by
# name only. lego (Traefik's ACME lib) reads the token from the environment
# while swarm secrets mount as files -- hence the sh wrapper below: export it
# from /run/secrets, then exec traefik (on PATH -- the Docker Hub image is
# alpine with /usr/local/bin/traefik, NOT the repo Dockerfile's /traefik;
# that mistake caused exit 127) forwarding the command: flags via "$@" (the
# literal "sh" arg is $0 so they all survive). All $ must be doubled.
#
# acme.json lives on a node-local volume, so each of the 3 replicas holds its
# own copy (sharing one file across replicas would need a distributed lock).
# The cost is 3 identical wildcard certs per issuance -- that is the Duplicate
# Certificate limit (5/week), NOT the 50/week registered-domain limit, and 3
# leaves headroom as long as replicas aren't re-issuing constantly.
services:
  traefik:
    image: traefik:v3.7.13
    # The swarm provider needs the cluster API. Traefik is constrained to
    # managers (below), so the local socket always serves it; :ro because
    # Traefik must only READ services/labels, never create containers.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/data
    networks:
      - proxy
    secrets:
      - cloudflare_api_token
    ports:
      # ingress mode = routing mesh: node:80/443 answers on all three
      # managers even though traffic may be served by a task on any of them.
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    entrypoint:
      - /bin/sh
      - -c
      - 'export CF_DNS_API_TOKEN="$$(cat /run/secrets/cloudflare_api_token)"; exec traefik "$$@"'
      - sh
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # web exists only to bounce to websecure (currently 308)
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=proxy
      - --certificatesresolvers.le.acme.email=job.r.huisman@gmail.com
      - --certificatesresolvers.le.acme.storage=/data/acme.json
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      # (no acme.domains here: removed in v3 -- routers declare
      # tls.domains[0].main=*.swarm.huisman.dev themselves, all resolving
      # to this one cert)
      - --accesslog=true
      - --log.level=INFO
      # Serves /ping on the internal `traefik` entrypoint (:8080, not
      # published); v3 auto-creates that entrypoint when ping is enabled.
      - --ping=true
    # Swarm ignores the image's own HEALTHCHECK, so declare it here.
    # `traefik healthcheck --ping` recreates the internal entrypoint itself and
    # HEADs it -- no other flag needed. Swarm surfaces health but does NOT
    # restart an unhealthy task; this is for status and rolling updates.
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      # global: one task per node, so the mesh never forwards to a node
      # without an edge; node.role keeps future workers out (no cluster API).
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      # Light, but it runs one task per node -- cap it so a leak can't take a
      # manager down.
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  proxy:
    name: proxy
    external: true

secrets:
  cloudflare_api_token:
    external: true

volumes:
  traefik-acme:
