# Edge router for the swarm: v3-native Swarm provider reads routing labels
# off SERVICES (they live in each app's compose file under deploy.labels).
# Steady state: client -> any node :80 (ingress mesh) -> traefik (one task) ->
# proxy overlay -> app:port; :80 308s to :443 and TLS is served with a single
# Let's Encrypt wildcard cert (Cloudflare DNS-01).
#
# Secret plumbing: the Cloudflare token is created OUT of git (Komodo UI ->
# swarm 'homelab' -> Secrets -> cloudflare_api_token) and referenced here by
# name only. lego (Traefik's ACME lib) resolves any provider variable suffixed
# `_FILE` by reading that file (it strips one trailing newline), so the token
# needs no sh wrapper at all -- point CF_DNS_API_TOKEN_FILE at the mounted
# secret and Traefik reads it natively. This retires the old wrapper, and with
# it the trap that overriding the entrypoint drops the image CMD (exit 127).
#
# The image contract is ENTRYPOINT ["/entrypoint.sh"] + CMD ["traefik"], and a
# compose `command:` REPLACES the CMD -- so `traefik` must stay the first
# element below, or /entrypoint.sh tries to exec "--entrypoints..." as a binary.
#
# acme.json lives on a node-local volume. There is exactly ONE edge task (see
# `deploy` below), so there is one copy and one wildcard cert -- no shared
# storage, no distributed lock, nothing racing on the Cloudflare TXT record.
# That is the whole reason the edge is replicated:1 and not one task per node.
#
# Rolling-update policy. stop-first is REQUIRED here, not cosmetic: under
# start-first Swarm would briefly run TWO Traefik tasks against one acme.json --
# the exact ACME race OSS Traefik cannot resolve (only one task may hold the
# wildcard and answer the DNS-01 challenge). Do NOT add failure_action:
# rollback -- Komodo's bundled bollard cannot parse it (README "Rolling updates").
x-update-config: &update-config
  order: stop-first
  parallelism: 1
  delay: 5s
  monitor: 30s

services:
  traefik:
    image: traefik:v3.7.13
    # The swarm provider needs the cluster API. Traefik is constrained to
    # managers (below), so the local socket always serves it; :ro because
    # Traefik must only READ services/labels, never create containers.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/data
    networks:
      - proxy
    secrets:
      - cloudflare_api_token
    environment:
      # lego reads the _FILE form natively; the file is the mounted swarm secret.
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
    ports:
      # ingress mode = routing mesh: node:80/443 answers on all three
      # managers even though traffic may be served by a task on any of them.
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    command:
      # `traefik` first: compose command replaces the image CMD (see header).
      - traefik
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # web exists only to bounce to websecure (currently 308)
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=proxy
      - --certificatesresolvers.le.acme.email=job.r.huisman@gmail.com
      - --certificatesresolvers.le.acme.storage=/data/acme.json
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      # (no acme.domains here: removed in v3 -- routers declare
      # tls.domains[0].main=*.swarm.huisman.dev themselves, all resolving
      # to this one cert)
      - --accesslog=true
      - --log.level=INFO
      # Serves /ping on the internal `traefik` entrypoint (:8080, not
      # published); v3 auto-creates that entrypoint when ping is enabled.
      - --ping=true
    # Declared explicitly so it is visible in the stack file.
    # `traefik healthcheck --ping` recreates the internal entrypoint itself and
    # HEADs it -- no other flag needed. Note Swarm *replaces* a task whose
    # container reports unhealthy, so a broken health command becomes a restart
    # loop (see the web-check pilot) -- it must be a real check.
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      # replicated:1, deliberately NOT global. Only ONE task may run the ACME
      # (DNS-01) resolver: multiple replicas race on the same Cloudflare TXT
      # record because OSS Traefik has no shared-ACME storage (the v1 KV-store
      # approach was dropped in 2.0; docs recommend an external cert controller
      # for multi-replica, or Traefik Enterprise). The ingress mesh still
      # accepts 80/443 on every node and forwards to this task, so any node IP
      # remains a valid entry. node.role == manager keeps it on a manager, where
      # the mounted docker.sock can reach the cluster API.
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  proxy:
    name: proxy
    external: true

secrets:
  cloudflare_api_token:
    external: true

volumes:
  traefik-acme:
