# Routed by Traefik: Host() on websecure, TLS via the shared le resolver
# (one wildcard cert covers *.swarm.huisman.dev). No published port:
# Traefik reaches whoami:80 over the shared `proxy` overlay.
services:
  whoami:
    image: traefik/whoami:v1.12.0
    networks:
      - proxy
    deploy:
      replicas: 3
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.whoami.rule=Host(`whoami.swarm.huisman.dev`)"
        - "traefik.http.routers.whoami.entrypoints=websecure"
        - "traefik.http.routers.whoami.tls=true"
        - "traefik.http.routers.whoami.tls.certresolver=le"
        - "traefik.http.routers.whoami.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  proxy:
    name: proxy
    external: true
