# Mesh canary: routed by Traefik (Host on websecure + the shared le resolver),
# no published port, and deliberately NOT pinned -- proving the mesh works from
# every node is the point. No container healthcheck is possible: it is a
# `scratch` image (no shell, no HTTP client, no health-check flag), so Uptime
# Kuma probes it externally.

# Rolling updates: stateless, start-first. Do NOT add failure_action: rollback
# (README "Rolling updates").
x-update-config: &update-config
  order: start-first
  parallelism: 1
  delay: 5s
  monitor: 30s

services:
  whoami:
    image: traefik/whoami:v1.12.0
    networks:
      - proxy
    deploy:
      replicas: 3
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.whoami.rule=Host(`whoami.swarm.huisman.dev`)"
        - "traefik.http.routers.whoami.entrypoints=websecure"
        - "traefik.http.routers.whoami.tls=true"
        - "traefik.http.routers.whoami.tls.certresolver=le"
        - "traefik.http.routers.whoami.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  proxy:
    name: proxy
    external: true
