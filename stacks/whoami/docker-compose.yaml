# Routed by Traefik via deploy.labels (Host rule below); Traefik reaches it
# as whoami:80 over the shared `proxy` overlay. The published :8080 is a
# cutover fallback while the edge is proven -- remove it in the TLS PR.
services:
  whoami:
    image: traefik/whoami:v1.12.0
    networks:
      - proxy
    ports:
      - "8080:80"
    deploy:
      replicas: 3
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.whoami.rule=Host(`whoami.swarm.int.huisman.dev`)"
        - "traefik.http.routers.whoami.entrypoints=web"
        - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  proxy:
    name: proxy
    external: true
