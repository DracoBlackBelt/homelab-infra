# Flame: self-hosted start page/dashboard. Routed by Traefik (Host on
# websecure + shared le resolver); no published port.
#
# PASSWORD comes from the swarm secret `flame_password` (seeded by
# ansible/secrets.yml from SOPS); the sh wrapper exports it from /run/secrets.
# GOTCHA: the image's CMD is `sh -c 'chown -R node /app/data && node server.js'`
# -- because the wrapper overrides the entrypoint, that CMD must be re-declared
# under `command:` (docker stack deploy drops the image CMD otherwise; see
# stacks/freshrss for the same trap).

# Rolling updates: node-local volume + an entrypoint that `chown -R`s it, so
# stop-first (two tasks would race the chown/write). failure_action: rollback
# (Swarm's default is `pause`) auto-reverts a bad deploy.
x-update-config: &update-config
  order: stop-first
  parallelism: 1
  delay: 5s
  monitor: 30s
  failure_action: rollback

services:
  flame:
    image: pawelmalak/flame:2.4.0
    networks:
      - proxy
    secrets:
      - flame_password
    volumes:
      - flame-data:/app/data
    entrypoint:
      - /bin/sh
      - -c
      - 'export PASSWORD="$$(cat /run/secrets/flame_password)"; exec docker-entrypoint.sh "$$@"'
      - sh
    command:
      - sh
      - -c
      - 'chown -R node /app/data && node server.js'
    environment:
      TZ: Europe/Amsterdam
      BASE_URL: https://home.swarm.huisman.dev
      PUID: "1000"
      PGID: "1000"
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:5005/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pool == 01
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.flame.rule=Host(`home.swarm.huisman.dev`)"
        - "traefik.http.routers.flame.entrypoints=websecure"
        - "traefik.http.routers.flame.tls=true"
        - "traefik.http.routers.flame.tls.certresolver=le"
        - "traefik.http.routers.flame.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.flame.loadbalancer.server.port=5005"

networks:
  proxy:
    name: proxy
    external: true

secrets:
  flame_password:
    external: true

volumes:
  flame-data:
