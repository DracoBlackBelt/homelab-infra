# Zerobyte: restic backup automation -- a VPS stack. It backs yuvomi (on
# docker-srv-01) up into the SeaweedFS S3 store on this same host. Adopted from
# a Dockhand-managed container that had no compose in git.
#
# APP_SECRET signs UI sessions, from a Komodo *secret* variable. Joining `edge`
# lets the edge route it: it IS published at zerobyte.huisman.dev and sits behind
# the VPS edge's tinyauth forwardAuth middleware (dynamic.yml), so the public
# path requires the SSO login before zerobyte's own sign-in. The repo credentials
# for the S3 target live in zerobyte's own data, not in this file.
services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:v0.42@sha256:08d1766977b28b3530054fc9df8b1a0ba3f7f9861c5367b03aa3e9ab71c2102f
    restart: unless-stopped
    # Required to mount remote sources (WebDAV/NFS/SMB/SFTP); upstream's compose
    # ships the caps/device. On Debian the docker-default AppArmor profile still
    # blocks the mount syscall with SYS_ADMIN alone ("Permission denied"), so the
    # profile is unconfined -- without it a configured WebDAV volume fails with
    # "can't open fuse device" / "mounting failed: Permission denied".
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      BASE_URL: https://zerobyte.huisman.dev
      APP_SECRET: ${ZEROBYTE_APP_SECRET}
      TRUST_PROXY: "true"
      TZ: Europe/Amsterdam
    volumes:
      - /opt/zerobyte:/var/lib/zerobyte
      - /etc/localtime:/etc/localtime:ro
    networks:
      - edge

networks:
  edge:
    external: true
