# Uptime monitoring webui. Routed by Traefik (Host on websecure + shared le
# resolver); no published port. Pinned to pool 01 because the SQLite volume is
# node-local (README "Placement"). Kuma's own monitors can use http://whoami --
# cross-stack service DNS over `proxy` that skips Traefik's http->https redirect.

# Rolling updates: SQLite + node-local volume -> stop-first (never two writers).
# Do NOT add failure_action: rollback (README "Rolling updates").
x-update-config: &update-config
  order: stop-first
  parallelism: 1
  delay: 5s
  monitor: 30s

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - proxy
    # The image's own HEALTHCHECK (a compiled Go binary); the 180s start_period
    # covers first-run SQLite init.
    healthcheck:
      test: ['CMD', 'extra/healthcheck']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pool == 01
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.uptime-kuma.rule=Host(`kuma.swarm.huisman.dev`)"
        - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
        - "traefik.http.routers.uptime-kuma.tls=true"
        - "traefik.http.routers.uptime-kuma.tls.certresolver=le"
        - "traefik.http.routers.uptime-kuma.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

networks:
  proxy:
    name: proxy
    external: true

volumes:
  uptime-kuma-data:
