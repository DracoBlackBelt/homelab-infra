# Pinned to the current upstream stable tag (floating ':1' is explicitly not allowed here).
# Single replica with a named volume: swarm local volumes live on the node the task runs
# on, so pin it to komodo-srv-01 -- if the task is ever rescheduled, it comes back with
# its data instead of a blank slate on another node.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.4
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "8081:3001"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == komodo-srv-01
      restart_policy:
        condition: any

volumes:
  uptime-kuma-data:
