# Pinned to the current upstream stable tag (floating ':1' is explicitly not allowed here).
# Single replica with a named volume: swarm local volumes live on the node the task runs
# on, so pin it to pool "01" -- if the task is ever rescheduled, it comes back with
# its data instead of a blank slate on another node (and app tasks stay off the
# raft managers).
# Routed by Traefik (Host() on websecure + shared le resolver); no published port.
# kuma's own monitors can use http://whoami -- cross-stack service DNS over the
# `proxy` overlay, which never touches Traefik's http->https redirect.

# Rolling updates: SQLite + node-local volume, so stop-first (never two writers).
# failure_action: rollback (Swarm's default is `pause`) auto-reverts a bad deploy.
x-update-config: &update-config
  order: stop-first
  parallelism: 1
  delay: 5s
  monitor: 30s
  failure_action: rollback

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - proxy
    # Declared explicitly (matching the image's own HEALTHCHECK -- a compiled Go
    # binary at /app/extra/healthcheck) so it is visible in the stack file. The
    # 180s start_period covers the first-run SQLite init.
    healthcheck:
      test: ['CMD', 'extra/healthcheck']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pool == 01
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.uptime-kuma.rule=Host(`kuma.swarm.huisman.dev`)"
        - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
        - "traefik.http.routers.uptime-kuma.tls=true"
        - "traefik.http.routers.uptime-kuma.tls.certresolver=le"
        - "traefik.http.routers.uptime-kuma.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

networks:
  proxy:
    name: proxy
    external: true

volumes:
  uptime-kuma-data:
