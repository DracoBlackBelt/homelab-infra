# SearXNG: private metasearch. Routed by Traefik (Host on websecure + the shared
# le resolver, i.e. the *.swarm.huisman.dev wildcard); no published port.
#
# SEARXNG_SECRET comes from the swarm secret `searxng_secret` (seeded by
# ansible/secrets.yml from SOPS). The image's entrypoint reads $SEARXNG_SECRET
# and writes it into settings.yml, so the sh wrapper exports it from
# /run/secrets. The image declares no CMD, so there is nothing to re-declare.
#
# Placement: NOT pinned to a node. Its only volume is /var/cache/searxng, a
# rebuildable result cache, so any worker will do -- `node.role == worker`
# keeps it off the raft managers without coupling it to one host.

# Rolling updates: stateless (only a disposable cache volume), so start-first
# for zero-downtime. failure_action: rollback (Swarm's default is `pause`).
x-update-config: &update-config
  order: start-first
  parallelism: 1
  delay: 5s
  monitor: 30s
  failure_action: rollback

services:
  searxng:
    image: searxng/searxng:2026.9.17-274b63b67
    networks:
      - proxy
    secrets:
      - searxng_secret
    volumes:
      - searxng-cache:/var/cache/searxng
    entrypoint:
      - /bin/sh
      - -c
      - 'export SEARXNG_SECRET="$$(cat /run/secrets/searxng_secret)"; exec /usr/local/searxng/entrypoint.sh "$$@"'
      - sh
    environment:
      TZ: Europe/Amsterdam
      SEARXNG_BASE_URL: https://search.swarm.huisman.dev/
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.searxng.rule=Host(`search.swarm.huisman.dev`)"
        - "traefik.http.routers.searxng.entrypoints=websecure"
        - "traefik.http.routers.searxng.tls=true"
        - "traefik.http.routers.searxng.tls.certresolver=le"
        - "traefik.http.routers.searxng.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.searxng.loadbalancer.server.port=8080"

networks:
  proxy:
    name: proxy
    external: true

secrets:
  searxng_secret:
    external: true

volumes:
  searxng-cache:
