# Grav: flat-file CMS. Routed by Traefik (Host on websecure + shared le
# resolver); no published port. Only the user/ tree is persisted (pages, themes,
# plugins, config); the rest of the image is disposable. The image ships curl,
# so the healthcheck uses it.
services:
  grav:
    image: getgrav/grav:1.7
    networks:
      - proxy
    volumes:
      - grav-user:/var/www/html/user
    environment:
      TZ: Europe/Amsterdam
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1/ -o /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-wrk-02
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grav.rule=Host(`grav.swarm.huisman.dev`)"
        - "traefik.http.routers.grav.entrypoints=websecure"
        - "traefik.http.routers.grav.tls=true"
        - "traefik.http.routers.grav.tls.certresolver=le"
        - "traefik.http.routers.grav.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.grav.loadbalancer.server.port=80"

networks:
  proxy:
    name: proxy
    external: true

volumes:
  grav-user:
