# Pocket-ID OIDC provider -- a VPS stack (server = "PBS"), NOT swarm. It is the
# auth plane: tinyauth (and later the swarm apps) authenticate against it. The
# public edge routes id.huisman.dev here via dynamic.yml; no port is published.
#
# ENCRYPTION_KEY comes from a Komodo *secret* variable. It encrypts everything
# under /opt/pocket-id/data, so it must stay byte-for-byte: rotating it makes the
# existing database unreadable. The data is a host bind mount, not a volume.
services:
  pocket-id:
    image: pocketid/pocket-id:v2@sha256:01540977dcf4c7b41b1159f34d68e4632f2658d62790e460ca65a42722b13c4a
    restart: unless-stopped
    environment:
      APP_URL: https://id.huisman.dev
      # Only the VPS edge (the `edge` bridge, 172.22.0.0/16) may supply the
      # client IP via X-Forwarded-For. `true` trusts every source and would let
      # a client spoof it, defeating rate limiting and audit logging.
      TRUST_PROXY: 172.22.0.0/16
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - /opt/pocket-id/data:/app/data
    networks:
      - edge
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

networks:
  edge:
    external: true
