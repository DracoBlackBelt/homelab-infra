# FreshRSS + PostgreSQL: the multi-service stateful pattern.
#  * The DB joins ONLY the stack-local `db` network -- no proxy overlay, no
#    published port, no router: unreachable except from FreshRSS.
#  * Both services own node-local volumes, so both are pinned to pool 03.
#  * Two secret patterns: Postgres reads POSTGRES_PASSWORD_FILE natively;
#    FreshRSS reads env only, so the wrapper exports DB_PASSWORD from
#    /run/secrets and execs the image entrypoint (every $ doubled).
#  * FRESHRSS_INSTALL auto-provisions config.php on first boot; its
#    $${DB_PASSWORD} is expanded by the image's own `eval echo` at boot, so the
#    password never lands in git. Keep the secret alphanumeric -- eval +
#    word-splitting; `openssl rand -hex` qualifies. Install args apply only on
#    the FIRST boot: changing them needs a fresh volume (or cli/reconfigure.php).
#  * No account is created here: make the admin via cli/create-user.php (Komodo
#    terminal), which keeps credentials out of git.

# Rolling updates: both services own node-local volumes -> stop-first. Do NOT add
# failure_action: rollback (README "Rolling updates").
x-update-config: &update-config
  order: stop-first
  parallelism: 1
  delay: 5s
  monitor: 30s

services:
  freshrss:
    image: freshrss/freshrss:1.30.0
    networks:
      - proxy
      - db
    secrets:
      - freshrss_db_password
    volumes:
      - freshrss-data:/var/www/FreshRSS/data
      - freshrss-extensions:/var/www/FreshRSS/extensions
    entrypoint:
      - /bin/sh
      - -c
      - 'export DB_PASSWORD="$$(cat /run/secrets/freshrss_db_password)"; exec /var/www/FreshRSS/Docker/entrypoint.sh "$$@"'
      - sh
    # GOTCHA (cost a silent exit-0 crashloop): `docker stack deploy` does NOT
    # append the image CMD when entrypoint is overridden, so entrypoint.sh's
    # final `exec "$@"` exec'd nothing. Redeclare the image's exact CMD here
    # (Docker/Dockerfile @ 1.30.0); all $ doubled.
    command:
      - /bin/sh
      - -c
      - '( [ -z "$$CRON_MIN" ] || cron ) && . /etc/apache2/envvars && exec apache2 -D FOREGROUND $$([ -n "$$OIDC_ENABLED" ] && [ "$$OIDC_ENABLED" -ne 0 ] && echo "-D OIDC_ENABLED")'
    environment:
      TZ: Europe/Amsterdam
      # refresh feeds at :04 and :34 (cron minutes, not the kuma kind)
      CRON_MIN: '4,34'
      # swarm overlay subnets only; traffic reaches us via the proxy network
      TRUSTED_PROXY: 10.10.0.0/16 172.16.0.0/12
      FRESHRSS_INSTALL: |-
        --default-user job
        --base-url https://rss.swarm.huisman.dev
        --title FreshRSS
        --language en
        --auth-type form
        --db-type pgsql
        --db-host db
        --db-user freshrss
        --db-base freshrss
        --db-password $${DB_PASSWORD}
    healthcheck:
      test: ['CMD', 'cli/health.php']
      interval: 75s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pool == 03
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.freshrss.rule=Host(`rss.swarm.huisman.dev`)"
        - "traefik.http.routers.freshrss.entrypoints=websecure"
        - "traefik.http.routers.freshrss.tls=true"
        - "traefik.http.routers.freshrss.tls.certresolver=le"
        - "traefik.http.routers.freshrss.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.freshrss.loadbalancer.server.port=80"

  db:
    image: postgres:18.6
    networks:
      - db
    secrets:
      - freshrss_db_password
    volumes:
      - freshrss-db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: freshrss
      POSTGRES_USER: freshrss
      POSTGRES_PASSWORD_FILE: /run/secrets/freshrss_db_password
    # small-RAM tuning: the stock 1 GB shared_buffers would eat this node
    command:
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freshrss -d freshrss']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Default is 10s; give Postgres time to shut down cleanly (checkpoint).
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pool == 03
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config

networks:
  proxy:
    name: proxy
    external: true
  db:
    driver: overlay

secrets:
  freshrss_db_password:
    external: true

volumes:
  freshrss-data:
  freshrss-extensions:
  freshrss-db-data:
