# Site/security analysis, stateless. Routed by Traefik (Host on websecure +
# shared le resolver); no published port. Deliberately internal-only: it fetches
# arbitrary URLs server-side (SSRF), so it must not be exposed publicly even
# behind auth. Placement: any worker (no volumes).

# Rolling updates: stateless, start-first. Do NOT add failure_action: rollback
# (README "Rolling updates").
x-update-config: &update-config
  order: start-first
  parallelism: 1
  delay: 5s
  monitor: 30s

services:
  web-check:
    image: lissy93/web-check:2.2.5@sha256:7e2ef5261764fa71fa3c85c40c49d2957295b20d02068ab3c95e8727b67bac29
    networks:
      - proxy
    environment:
      TZ: Europe/Amsterdam
    # The image ships no shell HTTP client, so use its own checker
    # (node healthcheck.js). Swarm replaces a task that reports unhealthy, so
    # the command must actually exist.
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.webcheck.rule=Host(`webcheck.swarm.huisman.dev`)"
        - "traefik.http.routers.webcheck.entrypoints=websecure"
        - "traefik.http.routers.webcheck.tls=true"
        - "traefik.http.routers.webcheck.tls.certresolver=le"
        - "traefik.http.routers.webcheck.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.webcheck.loadbalancer.server.port=3000"

networks:
  proxy:
    name: proxy
    external: true
