# Web-Check: site/security analysis. Stateless. Routed by Traefik (Host on
# websecure + shared le resolver); no published port.
#
# Deliberately internal-only: web-check fetches arbitrary URLs server-side
# (SSRF), so it must not be exposed publicly even behind auth.
#
# Placement: NOT pinned (no volumes). `node.role == worker` keeps it off the
# raft managers without coupling it to one host.

# Rolling updates: stateless, so start-first for zero-downtime.
# failure_action: rollback (Swarm's default is `pause`) auto-reverts a bad deploy.
x-update-config: &update-config
  order: start-first
  parallelism: 1
  delay: 5s
  monitor: 30s
  failure_action: rollback

services:
  web-check:
    image: lissy93/web-check:2.2.5
    networks:
      - proxy
    environment:
      TZ: Europe/Amsterdam
    # The web-check image ships no shell HTTP client, so use its own checker
    # (node healthcheck.js). A failing check gets the task replaced by Swarm,
    # so it must be a command that actually exists in the image.
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: any
      update_config: *update-config
      rollback_config: *update-config
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.webcheck.rule=Host(`webcheck.swarm.huisman.dev`)"
        - "traefik.http.routers.webcheck.entrypoints=websecure"
        - "traefik.http.routers.webcheck.tls=true"
        - "traefik.http.routers.webcheck.tls.certresolver=le"
        - "traefik.http.routers.webcheck.tls.domains[0].main=*.swarm.huisman.dev"
        - "traefik.http.services.webcheck.loadbalancer.server.port=3000"

networks:
  proxy:
    name: proxy
    external: true
